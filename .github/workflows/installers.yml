name: Seven Desk native installer QA

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "package*.json"
      - "scripts/generate-icons.mjs"
      - "scripts/hash-installers.mjs"
      - ".github/workflows/installers.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "package*.json"
      - "scripts/generate-icons.mjs"
      - "scripts/hash-installers.mjs"
      - ".github/workflows/installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: Installer QA / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-22.04
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libxkbcommon-dev libxcb-randr0-dev pkg-config clang rpm
      # The committed npm lock currently contains only Windows native optional
      # packages; npm's platform-native resolution must be enabled until the
      # lock can be regenerated for all supported targets.
      - name: Install JavaScript dependencies
        run: npm install --no-package-lock --include=optional --no-audit --no-fund
      - name: Generate Seven Desk icons
        run: node scripts/generate-icons.mjs
      - name: Test native session code
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked
      - name: Build installable native packages
        run: npm exec --workspace @seven/desktop -- tauri build --bundles ${{ matrix.bundles }}
      - name: Hash QA packages
        run: node scripts/hash-installers.mjs
      - name: Upload QA packages (NOT A RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: seven-desk-unsigned-qa-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7

# These artifacts only verify packaging and native unit tests on each OS.
# Screen/input permissions, actual cross-OS sessions and signing/notarization
# still require tests on installed systems before release.
