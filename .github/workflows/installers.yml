name: Seven Desk native installer QA

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "scripts/generate-icons.mjs"
      - ".github/workflows/installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: Installer QA / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-22.04
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config rpm
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Seven Desk icons
        run: node scripts/generate-icons.mjs
      - name: Build installable native packages
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}
      - name: Upload QA packages (NOT A RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: seven-desk-unsigned-qa-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7

# These artifacts only verify packaging. They are NOT a support-ready product:
# no remote media/control yet, and no production code-signing/notarization.
