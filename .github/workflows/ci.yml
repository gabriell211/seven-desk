name: Seven Desk CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust contracts and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install Linux credential-store headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and API tests
        run: cargo test --workspace --all-targets
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke real backend loopback (no Docker or database)
        run: npm run smoke:server

  desktop-ui:
    name: React TypeScript and static bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-package-lock --include=optional --no-audit --no-fund
      - name: Verify frontend types and build
        run: npm run desktop:build
      - name: Smoke real Vite production preview on loopback
        run: npm run smoke:desktop
      - name: Generate deterministic native icons
        run: node scripts/generate-icons.mjs
      - name: Verify icons were generated
        run: |
          test -s apps/desktop/src-tauri/icons/icon.png
          test -s apps/desktop/src-tauri/icons/icon.ico
          test -s apps/desktop/src-tauri/icons/icon.icns

  tauri-linux:
    name: Tauri native compilation (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - run: npm install --no-package-lock --include=optional --no-audit --no-fund
      - run: npm run desktop:build
      - run: node scripts/generate-icons.mjs
      - name: Compile native app
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test native HTTPS endpoint validation
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib server_config::tests

  tauri-windows:
    name: Tauri native compilation (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-package-lock --include=optional --no-audit --no-fund
      - name: Build UI and native icons
        run: |
          npm run desktop:build
          node scripts/generate-icons.mjs
      - name: Smoke desktop React preview on Windows
        run: npm run smoke:desktop
      - name: Verify Windows capture implementation compiles
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Smoke native backend on clean Windows runner
        run: npm run smoke:server
