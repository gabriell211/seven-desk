# Laboratório de compatibilidade RustDesk OSS: hbbs (ID/P2P) + hbbr (relay).
# Linux host networking é intencional: NAT traversal exige endereços reais.
# Não confundir estes serviços com o control plane HTTP experimental do Seven Desk.
services:
  hbbs:
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server:1.1.16}
    working_dir: /data
    command: ["hbbs", "-r", "${RUSTDESK_RELAY_HOST:?Set RUSTDESK_RELAY_HOST}", "-k", "_"]
    network_mode: host
    volumes:
      - ./data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/id_ed25519.pub && test -s /data/id_ed25519"]
      interval: 5s
      timeout: 3s
      retries: 12

  hbbr:
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server:1.1.16}
    working_dir: /data
    command: ["hbbr", "-k", "_"]
    network_mode: host
    volumes:
      - ./data:/data
    depends_on:
      hbbs:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
