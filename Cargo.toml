[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/security",
  "crates/identity",
  "apps/server"
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
axum = "0.8.9"
