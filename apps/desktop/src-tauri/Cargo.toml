[package]
name = "seven-desk-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
build = "build.rs"
license = "UNLICENSED"

[lib]
name = "seven_desk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.12.3" }
serde = { version = "1.0", features = ["derive"] }
seven-identity = { path = "../../../crates/identity" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
seven-protocol = { path = "../../../crates/protocol" }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "=0.9.8", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }


[build-dependencies]
tauri-build = "2.7.2"

[workspace]
