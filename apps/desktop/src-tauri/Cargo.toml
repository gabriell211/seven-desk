[package]
name = "seven-desk-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
build = "build.rs"
license = "UNLICENSED"

[lib]
name = "seven_desk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.12.3" }
serde = { version = "1.0", features = ["derive"] }
seven-identity = { path = "../../../crates/identity" }

[build-dependencies]
tauri-build = "2.7.2"

[workspace]
